worker_processes auto;

error_log /dev/stderr info;
pid /tmp/gateway-nginx.pid;

events {
    worker_connections 4096;
}

http {
    access_log /dev/stdout;
    include /etc/nginx/mime.types;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # DSH's browser client currently sends unary RPCs to absolute /api/... URLs.
    # The Referer distinguishes those calls from LiteLLM's own /api UI calls.
    map $http_referer $api_backend {
        default http://litellm:4000;
        ~^https?://[^/]+/deepseek-harness(?:/|$) http://deepseek-harness:3080;
    }

    server {
        listen 0.0.0.0:4000;
        server_name _;

        location = /deepseek-harness {
            return 301 /deepseek-harness/;
        }

        location ^~ /deepseek-harness/ {
            # The trailing slash strips /deepseek-harness/ before the request
            # reaches the inner DSH Nginx.
            proxy_pass http://deepseek-harness:3080/;
            proxy_http_version 1.1;
            proxy_set_header Authorization $http_authorization;
            proxy_set_header Accept-Encoding "";
            proxy_set_header Host $host;
            proxy_set_header Origin $http_origin;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            proxy_buffering off;

            # DSH emits <base href="/"> for its root deployment. Rewrite that
            # one browser hint so relative assets remain under the subpath.
            sub_filter_types text/html;
            sub_filter_once off;
            sub_filter '<base href="/">' '<base href="/deepseek-harness/">';
        }

        # Browser Remote streams use an absolute /api/remote.mux URL.
        location = /api/remote.mux {
            proxy_pass http://deepseek-harness:3080;
            proxy_http_version 1.1;
            proxy_set_header Authorization $http_authorization;
            proxy_set_header Host $host;
            proxy_set_header Origin $http_origin;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            proxy_buffering off;
        }

        # Other DSH RPC calls use the DSH Referer; LiteLLM's own /api calls
        # continue to use the normal LiteLLM backend.
        location = /api {
            proxy_pass $api_backend;
            proxy_http_version 1.1;
            proxy_set_header Authorization $http_authorization;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        location ^~ /api/ {
            proxy_pass $api_backend;
            proxy_http_version 1.1;
            proxy_set_header Authorization $http_authorization;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        # Everything else remains LiteLLM: /v1/*, /ui/*, /health, etc.
        location / {
            proxy_pass http://litellm:4000;
            proxy_http_version 1.1;
            proxy_set_header Authorization $http_authorization;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }
    }
}

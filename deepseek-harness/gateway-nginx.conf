worker_processes auto;

error_log /dev/stderr info;
pid /tmp/gateway-nginx.pid;

events {
    worker_connections 4096;
}

http {
    access_log /dev/stdout;
    include /etc/nginx/mime.types;

    # 请求体上限。默认只有 1m，而 Codex / Claude Code 会把整段对话历史
    # （大文件、长上下文）塞进 /v1/responses 或 /v1/chat/completions 的
    # JSON body 里，超过 1m 就被这层直接拒成
    # 「413 Request Entity Too Large ... nginx/1.27.x」——请求根本没到
    # LiteLLM。这与模型上下文长度无关，纯粹是 nginx 的传输层限制，所以单独
    # 放宽到 512m；真正的大请求由 LiteLLM / 上游自行处理。
    client_max_body_size 512m;

    # /api 用的是变量形式的 proxy_pass（$api_backend），nginx 对变量里的主机名
    # 只能在**运行期**解析：没有 resolver 时它不会退回启动期解析，而是直接报
    # 「no resolver defined to resolve ...」并回 502。127.0.0.11 是 Docker 内置
    # DNS，compose 网络里的服务名（litellm / deepseek-harness）都靠它解析。
    # valid 取小值：容器重建后 IP 会变，长 TTL 会把请求打到已消失的旧地址。
    resolver 127.0.0.11 valid=10s ipv6=off;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # DSH's browser client currently sends unary RPCs to absolute /api/... URLs.
    # The Referer distinguishes those calls from LiteLLM's own /api UI calls.
    map $http_referer $api_backend {
        default http://litellm:4000;
        ~^https?://[^/]+/deepseek-harness(?:/|$) http://deepseek-harness:3080;
    }

    server {
        listen 0.0.0.0:4000;
        server_name _;

        location = /deepseek-harness {
            return 301 /deepseek-harness/;
        }

        location ^~ /deepseek-harness/ {
            # The trailing slash strips /deepseek-harness/ before the request
            # reaches the inner DSH Nginx.
            proxy_pass http://deepseek-harness:3080/;
            proxy_http_version 1.1;
            proxy_set_header Authorization $http_authorization;
            proxy_set_header Accept-Encoding "";
            proxy_set_header Host $host;
            proxy_set_header Origin $http_origin;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            proxy_buffering off;

            # Subpath support comes from Vite's `base: './'`: the built
            # index.html references its assets relatively (`./assets/...`), so
            # a page served at `/deepseek-harness/` resolves them under the
            # subpath automatically. The rewrite below is therefore a
            # defensive no-op on current builds (they emit no `<base href>`
            # at all); it only matters if a future build switches back to an
            # absolute `<base href="/">`.
            # 不写 sub_filter_types：它默认就含 text/html，显式再写一次
            # nginx -t 会报 `duplicate MIME type "text/html"` 警告。
            sub_filter_once off;
            sub_filter '<base href="/">' '<base href="/deepseek-harness/">';

            # DSH 只在「本机回环地址」打开页面时才启用设置持久化：
            # packages/client/ui-settings/src/client/index.ts 里
            #   persistence = ctx.remote.$host.isLoopback ? 'host' : 'memory'
            # 而 isLoopback 只看 hostname 是不是 localhost/127.0.0.1/::1。经
            # 反向代理用 10.x 访问时它就是内存模式，设置面板直接报
            # 「settings are unavailable in this browser」，模型页也打不开。
            #
            # 这里在内联注一段 transport hooks，显式声明 ownsHost。DSH 会把
            # 它当作「页面就在主机进程内」，从而启用 host 持久化。只补
            # ownsHost 不补 fetch 是安全的：连接层会退回 globalThis.fetch。
            # 关键时刻是插在入口 <script type="module"> 之前 —— 模块脚本是
            # defer 的，内联经典脚本先执行，先设置的全局变量才能被读到。
            sub_filter '<script type="module" crossorigin src=' '<script>globalThis.__DSH_TRANSPORT__={ownsHost:true}</script><script type="module" crossorigin src=';
        }

        # Browser Remote streams use an absolute /api/remote.mux URL.
        location = /api/remote.mux {
            proxy_pass http://deepseek-harness:3080;
            proxy_http_version 1.1;
            proxy_set_header Authorization $http_authorization;
            proxy_set_header Host $host;
            proxy_set_header Origin $http_origin;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            proxy_buffering off;
        }

        # DSH 的客户端插件 bundle 用绝对路径 /plugins/...（以及 /plugins/events
        # 这个 HMR SSE）请求，base href 改不了它们，所以这里必须单独转发一份。
        # 不重写路径：DSH 期望的就是 /plugins/... 本身。内层 Nginx 会统一
        # 覆盖 Host/Origin/Cookie，所以这里照常转发浏览器带来的头即可。
        location ^~ /plugins/ {
            proxy_pass http://deepseek-harness:3080;
            proxy_http_version 1.1;
            proxy_set_header Authorization $http_authorization;
            proxy_set_header Host $host;
            proxy_set_header Origin $http_origin;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            # HMR 走 SSE，不能缓冲。
            proxy_buffering off;
        }

        # Other DSH RPC calls use the DSH Referer; LiteLLM's own /api calls
        # continue to use the normal LiteLLM backend.
        location = /api {
            proxy_pass $api_backend;
            proxy_http_version 1.1;
            proxy_set_header Authorization $http_authorization;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        location ^~ /api/ {
            proxy_pass $api_backend;
            proxy_http_version 1.1;
            proxy_set_header Authorization $http_authorization;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        # Everything else remains LiteLLM: /v1/*, /ui/*, /health, etc.
        location / {
            proxy_pass http://litellm:4000;
            proxy_http_version 1.1;
            proxy_set_header Authorization $http_authorization;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }
    }
}

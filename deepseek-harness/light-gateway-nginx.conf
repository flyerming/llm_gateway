worker_processes auto;

error_log /dev/stderr info;
pid /tmp/light-gateway-nginx.pid;

events {
    worker_connections 4096;
}

http {
    access_log /dev/stdout;
    include /etc/nginx/mime.types;

    # DSH 会把长对话、附件和工具输入放进请求体；默认 1m 太小。
    client_max_body_size 512m;

    resolver 127.0.0.11 valid=10s ipv6=off;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    server {
        listen 0.0.0.0:3081${LIGHT_SSL_LISTEN_SUFFIX};
        ${LIGHT_SSL_DIRECTIVES}
        server_name _;
        set $dsh_host deepseek-harness;

        # Settings 页面里的“打开配置文件”按钮不能访问 DSH 的内部
        # /__dsh_config/，这里把对外的 /config/ 转进去。
        location = /config {
            return 301 /config/;
        }

        location ^~ /config/ {
            rewrite ^/config/(.*)$ /__dsh_config/$1 break;
            proxy_pass http://$dsh_host:3080;
            proxy_http_version 1.1;
            proxy_set_header Authorization $http_authorization;
            proxy_set_header Host $host;
            proxy_set_header Origin $http_origin;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 60s;
            proxy_send_timeout 60s;
            proxy_buffering off;
        }

        # 所有其它路径都直接转给 DSH 内层 Nginx：
        # /                 页面与静态资源
        # /api/*            DSH RPC
        # /api/remote.mux   远程 WebSocket
        # /plugins/*        插件 bundle 与 SSE
        location / {
            proxy_pass http://$dsh_host:3080;
            proxy_http_version 1.1;
            proxy_set_header Authorization $http_authorization;
            proxy_set_header Accept-Encoding "";
            proxy_set_header Host $host;
            proxy_set_header Origin $http_origin;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            proxy_buffering off;

            # 直接用远程 IP/域名打开时，DSH 前端会认为当前页面不是
            # loopback，设置页会退化为 memory persistence。把 transport
            # 标记注入到入口 module script 之前，恢复 host persistence。
            #
            # 同时拦截设置页的“打开配置文件”按钮，改到本边缘入口的
            # /config/，而不是尝试在无桌面的容器里 xdg-open。
            sub_filter_once off;
            sub_filter '<script type="module" crossorigin src=' '<script>globalThis.__DSH_TRANSPORT__={ownsHost:true};document.addEventListener("click",function(e){var b=e.target.closest&&e.target.closest("button");if(!b)return;var t=(b.innerText||b.getAttribute("aria-label")||"").toLowerCase();if(t.indexOf("打开配置文件")>=0||t.indexOf("open settings file")>=0||t.indexOf("open configuration file")>=0){e.preventDefault();e.stopImmediatePropagation();window.open("/config/","_blank","noopener")}},true)</script><script type="module" crossorigin src=';
        }
    }
}

worker_processes auto;

error_log /dev/stderr info;
pid /tmp/nginx.pid;

# 显式声明 worker 运行用户：默认 nginx.conf 里的 user 指令被换成这份文件后，
# 只能依赖编译期默认值。auth_basic_user_file（/etc/dsh-auth/htpasswd）是 worker
# 真正去打开的文件，所以这里必须和 start.sh 里 fix_htpasswd_perms 用的组一致。
user www-data www-data;

events {
    worker_connections 2048;
}

http {
    access_log /dev/stdout;
    include /etc/nginx/mime.types;

    # 请求体上限，理由同外层 gateway-edge：默认 1m 会让带附件/长内容的请求
    # 在这层被 413 拒掉。DSH 的 agent 也可以上传文件，所以两层都要放宽。
    client_max_body_size 512m;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    server {
        listen 0.0.0.0:3080;
        server_name _;

        auth_basic "DeepSeek Harness";
        # 放在独立卷 /etc/dsh-auth（0750 root:www-data）里，而不是用户数据卷
        # /data 下：容器内的 agent 以专属 UID 运行，既列举不到这个目录，也没
        # 有 www-data 组，所以读不到密码摘要；将来单独备份 /data 也不会带走它。
        auth_basic_user_file /etc/dsh-auth/htpasswd;

        location = /__provision {
            internal;
            proxy_pass http://127.0.0.1:3090/provision;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_set_header X-Remote-User $remote_user;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            # provisioner 现在会「等用户实例真正可用」才返回（首次访问要等
            # `dsh web` 起完并兑换会话 cookie，最坏 DSH_STARTUP_TIMEOUT_SECONDS
            # 秒）。auth_request 子请求默认 60s 读超时，不改这里就会出现
            # “冷启动第一次访问返回 500、再刷新就好”的现象。
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
        }

        # Browser-side settings editor. Basic Auth is inherited from the
        # server; the provisioner receives the authenticated username and only
        # serves that user's own settings.yaml.
        location ^~ /__dsh_config/ {
            client_max_body_size 2m;
            proxy_pass http://127.0.0.1:3090/config/;
            proxy_http_version 1.1;
            proxy_set_header X-Remote-User $remote_user;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 30s;
            proxy_send_timeout 30s;
        }

        location / {
            auth_request /__provision;
            auth_request_set $dsh_port $upstream_http_x_dsh_port;
            auth_request_set $dsh_cookie $upstream_http_x_dsh_cookie;

            proxy_pass http://127.0.0.1:$dsh_port;
            proxy_http_version 1.1;

            # DSH rc.2 validates the browser authority/origin as loopback.
            proxy_set_header Host 127.0.0.1;
            proxy_set_header Origin http://127.0.0.1;
            # 用 provisioner 兑换出的会话 cookie 覆盖请求里的 Cookie：DSH 的
            # 签名 cookie 绑定到 Host（此处固定 127.0.0.1），由服务端统一注入，
            # 浏览器就不必自己走 /?token= 兑换，也没有重定向死循环的问题。
            proxy_set_header Cookie $dsh_cookie;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;

            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }
    }
}

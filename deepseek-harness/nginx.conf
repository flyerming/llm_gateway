worker_processes auto;

error_log /dev/stderr info;
pid /tmp/nginx.pid;

events {
    worker_connections 2048;
}

http {
    access_log /dev/stdout;
    include /etc/nginx/mime.types;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    server {
        listen 0.0.0.0:3080;
        server_name _;

        auth_basic "DeepSeek Harness";
        auth_basic_user_file /data/htpasswd;

        location = /__provision {
            internal;
            proxy_pass http://127.0.0.1:3090/provision;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_set_header X-Remote-User $remote_user;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location / {
            auth_request /__provision;
            auth_request_set $dsh_port $upstream_http_x_dsh_port;

            proxy_pass http://127.0.0.1:$dsh_port;
            proxy_http_version 1.1;

            # DSH rc.2 validates the browser authority/origin as loopback.
            proxy_set_header Host 127.0.0.1;
            proxy_set_header Origin http://127.0.0.1;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;

            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }
    }
}
